services:
  webforms-links-generator:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      ADMIN_GATEWAY_SECRET: ${ADMIN_GATEWAY_SECRET:?set ADMIN_GATEWAY_SECRET}
      API_URL: ${API_URL:?set API_URL}
      ACTIVIST_SPONSOR_VAT: ${ACTIVIST_SPONSOR_VAT:?set ACTIVIST_SPONSOR_VAT}
      ACTIVIST_SPONSOR_CODE: ${ACTIVIST_SPONSOR_CODE:?set ACTIVIST_SPONSOR_CODE}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    restart: unless-stopped
